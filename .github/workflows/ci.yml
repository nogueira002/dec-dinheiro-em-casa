name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:

  # ── Django (lint + testes + cobertura) ─────────────────────────────────────
  django:
    name: Django — Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('django-api/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          cd django-api
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          cd django-api
          ruff check .

      - name: Tests + Coverage
        run: |
          cd django-api
          pytest --cov=simulations --cov-report=term-missing --cov-fail-under=50

  # ── .NET (restore + build) ──────────────────────────────────────────────────
  dotnet:
    name: .NET — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & Build
        run: |
          cd dotnet-mvc
          dotnet restore
          dotnet build --no-restore --configuration Release
