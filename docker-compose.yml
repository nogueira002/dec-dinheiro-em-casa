services:

  # ──────────────────────────────────────────────
  # Portal .NET MVC (Educational Platform)
  # ──────────────────────────────────────────────
  portal:
    build:
      context: ./dotnet-mvc
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=${MYSQL_DB};user=${MYSQL_USER};password=${MYSQL_PASSWORD}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Django REST API (Financial Module)
  # ──────────────────────────────────────────────
  django-api:
    build:
      context: ./django-api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MYSQL_HOST: mysql-financeira
      MYSQL_DB: dec_financeira
      MYSQL_USER: ${MYSQL_FINANCEIRA_USER}
      MYSQL_PASSWORD: ${MYSQL_FINANCEIRA_PASSWORD}
      MYSQL_PORT: 3306
    depends_on:
      mysql-financeira:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MySQL — base de dados do portal MVC (dec_educativa)
  # ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "localhost"
        - "-u"
        - "root"
        - "--password=${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MySQL Financeira — base de dados do Django API (dec_financeira)
  # ──────────────────────────────────────────────
  mysql-financeira:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dec_financeira
      MYSQL_USER: ${MYSQL_FINANCEIRA_USER}
      MYSQL_PASSWORD: ${MYSQL_FINANCEIRA_PASSWORD}
    volumes:
      - mysql-financeira-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "localhost"
        - "-u"
        - "root"
        - "--password=${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Nginx — reverse proxy (única porta pública)
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      portal:
        condition: service_healthy
      django-api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

# ──────────────────────────────────────────────
# Rede interna — MySQL nunca acessível externamente
# ──────────────────────────────────────────────
networks:
  internal:
    driver: bridge

# ──────────────────────────────────────────────
# Volumes para persistência dos dados MySQL
# ──────────────────────────────────────────────
volumes:
  mysql-data:
  mysql-financeira-data: